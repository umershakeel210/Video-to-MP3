[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-mp3"
version = "1.1.0"
description = "Professional Windows desktop video-to-MP3 converter"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "psutil>=5.9,<8"]

[project.scripts]
video-to-mp3 = "videotomp3.main:main"

[tool.setuptools.packages.find]
where = ["src"]
